<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 275" role="img" aria-label="main: registers around ALUCore8, controlled by the ControlUnit">
    <style>
svg{color:#1b221d;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bx{fill:#ffffff;stroke:currentColor;stroke-width:1.4}
.bx.hl{stroke:#1f9d3a;stroke-width:2.5;fill:#e3f3e6}
.bt1{font-size:11.5px;font-weight:700;fill:currentColor}
.bt2{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:11px;fill:#5f6a62}
.lb{font-family:-apple-system,"Segoe UI",Helvetica,Arial,sans-serif;font-size:13px;fill:currentColor}
.lb.sm{font-size:11px;fill:#5f6a62}
.wr{stroke:currentColor;stroke-width:1.3;opacity:.75}
.bus{stroke:#2f5fb8;stroke-width:3.2}
.jn{fill:currentColor}
.pp{fill:rgba(31,157,58,.22);stroke:#1f9d3a;stroke-width:1}
.st{fill:#fff;stroke:currentColor;stroke-width:1.4}
.go .bx{stroke:currentColor;stroke-width:1.4}
@media (prefers-color-scheme:dark){svg{color:#e5ebe6}.bx,.st{fill:#161b22}.bx.hl{fill:#1d3324;stroke:#3ccf5c}.bt2,.lb.sm{fill:#9aa69d}.bus{stroke:#7aa3f2}.pp{stroke:#3ccf5c}}
</style><defs><marker id="ah-main" viewBox="0 0 10 10" refX="9" refY="5" markerUnits="userSpaceOnUse" markerWidth="9" markerHeight="9" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="currentColor"/></marker></defs>
    <text class="lb" x="10" y="54" text-anchor="start">A</text><text class="lb" x="10" y="114" text-anchor="start">B</text><polyline class="bus" points="24,50 60,50" fill="none" marker-end="url(#ah-main)"/><polyline class="bus" points="24,110 60,110" fill="none" marker-end="url(#ah-main)"/><g class="go"><rect class="bx " x="60" y="30" width="110" height="40" rx="4"/><text class="bt1" x="115" y="54" text-anchor="middle">RegisterA</text></g><g class="go"><rect class="bx " x="60" y="90" width="110" height="40" rx="4"/><text class="bt1" x="115" y="114" text-anchor="middle">RegisterB</text></g><polyline class="bus" points="170,50 210,50" fill="none" marker-end="url(#ah-main)"/><polyline class="bus" points="170,110 210,110" fill="none" marker-end="url(#ah-main)"/><g class="go"><rect class="bx " x="210" y="30" width="110" height="100" rx="4"/><text class="bt1" x="265" y="84" text-anchor="middle">ALUCore8</text></g><text class="lb sm" x="265" y="176" text-anchor="middle">Op</text><polyline class="wr" points="265,164 265,130" fill="none" marker-end="url(#ah-main)"/><polyline class="bus" points="320,50 350,50" fill="none" marker-end="url(#ah-main)"/><polyline class="wr" points="320,110 350,110" fill="none" marker-end="url(#ah-main)"/><text class="lb sm" x="335" y="103" text-anchor="middle">flags</text><g class="go"><rect class="bx " x="350" y="30" width="140" height="40" rx="4"/><text class="bt1" x="420" y="54" text-anchor="middle">OutputRegister</text></g><g class="go"><rect class="bx " x="350" y="90" width="140" height="40" rx="4"/><text class="bt1" x="420" y="114" text-anchor="middle">FlagRegister</text></g><polyline class="bus" points="490,50 520,50" fill="none" marker-end="url(#ah-main)"/><polyline class="wr" points="490,110 520,110" fill="none" marker-end="url(#ah-main)"/><g class="go"><rect class="bx " x="520" y="30" width="112" height="40" rx="4"/><text class="bt1" x="576" y="46" text-anchor="middle">HexDecoder7</text><text class="bt2" x="576" y="61" text-anchor="middle">→ 2 digits</text></g><rect class="bx " x="520" y="90" width="112" height="40" rx="4"/><text class="bt1" x="576" y="106" text-anchor="middle">Z C S V</text><text class="bt2" x="576" y="121" text-anchor="middle">LEDs</text><g class="go"><rect class="bx " x="210" y="210" width="110" height="50" rx="4"/><text class="bt1" x="265" y="231" text-anchor="middle">ControlUnit</text><text class="bt2" x="265" y="246" text-anchor="middle">FSM</text></g><text class="lb sm" x="150" y="230" text-anchor="end">Load, Execute,</text><text class="lb sm" x="150" y="246" text-anchor="end">Reset, CLK</text><polyline class="wr" points="156,235 210,235" fill="none" marker-end="url(#ah-main)"/><polyline class="wr" points="235,210 235,180 115,180 115,130" fill="none" marker-end="url(#ah-main)"/><text class="lb sm" x="175" y="174" text-anchor="middle">LoadAB</text><polyline class="wr" points="295,210 295,180 420,180 420,130" fill="none" marker-end="url(#ah-main)"/><text class="lb sm" x="357" y="174" text-anchor="middle">LoadOut</text></svg>