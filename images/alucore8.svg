<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 380" role="img" aria-label="ALUCore8: every operation block feeds a 16-way selector">
    <style>
svg{color:#1b221d;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bx{fill:#ffffff;stroke:currentColor;stroke-width:1.4}
