<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 220" role="img" aria-label="Full adder: two half adders and an OR gate">
    <style>
svg{color:#1b221d;font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.bx{fill:#ffffff;stroke:currentColor;stroke-width:1.4}
